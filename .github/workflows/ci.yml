# Tests, lint and an installable debug APK on every push.
#
# The app has no external runtime dependencies at all; the only thing that
# needs installing is the Android SDK, and the runner image ships it ready.

name: CI

on:
  push:
    # Tags do not trigger this workflow: once `branches` is given, tag pushes
    # no longer match — they go to the Release workflow.
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Back-to-back pushes on the same branch cancel the run still in progress.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Test, lint and debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The project compiles with jvmTarget 17; the version is pinned explicitly
      # instead of trusting the runner's default JDK.
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle cache and wrapper validation. The wrapper JAR lives in the repo;
      # validation checks that it belongs to a known Gradle release.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Android SDK components
        run: bash .github/scripts/android-sdk.sh

      # Tests run on the JVM, no emulator needed. Lint warnings do not break
      # the build, but the report is kept as an artifact.
      - name: Tests and lint
        run: ./gradlew test lintDebug

      - name: Debug APK
        run: ./gradlew assembleDebug

      - name: Name the APK
        id: apk
        run: bash .github/scripts/collect-apk.sh debug

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Uploaded on failure too: the report of the failing test and the lint
      # findings lives here. The run log gives a summary; the details are in
      # these HTML files.
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
