# Release publishing: when a tag starting with `v` is pushed, a signed release
# APK is built and attached to the GitHub release (Releases).
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The signing key never enters the repository; it comes from the secrets in
# the repository settings (Settings -> Secrets and variables -> Actions):
#
#   ANDROID_KEYSTORE_BASE64    the keystore, base64-encoded:  base64 -w0 keys/norda-release.jks
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          optional; defaults to "norda" when empty
#   ANDROID_KEY_PASSWORD       optional; the keystore password is used when empty
#                              (keytool's PKCS12 default makes the two identical anyway)
#
# If the secrets are not defined the run does not break: the APK is built
# unsigned, its name carries "unsigned" and a warning is raised. An unsigned APK
# cannot be installed on a phone — the secrets must be defined for a permanent
# install.

name: Release

on:
  push:
    tags: ['v*']
  # Publishing from an environment that cannot push tags: trigger manually and
  # pass the tag as an input — `gh release create --target` creates the tag here.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (vX.Y.Z); if empty only the APK is built'
        required: false
        type: string

permissions:
  contents: write   # to create the release and attach the APK

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # The release notes are generated from the commits since the previous
          # tag; a shallow clone does not have that history.
          fetch-depth: 0

      # The tag can come from two sources: a tag push or the `tag` input of a
      # manual trigger. Later steps look at a single RELEASE_TAG variable.
      - name: Determine the tag
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: echo "RELEASE_TAG=${PUSHED_TAG:-$INPUT_TAG}" >> "$GITHUB_ENV"

      # The tag name is not embedded in the shell directly, it goes through an
      # environment variable: git allows characters such as `;`, `&`, `$` in
      # tag names, and an embedded name could have run commands on the runner.
      - name: Check that the tag matches the version
        if: env.RELEASE_TAG != ''
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: bash .github/scripts/check-tag.sh "$TAG"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Android SDK components
        run: bash .github/scripts/android-sdk.sh

      # The keystore is written to disk only in the run's temporary directory;
      # the passwords never touch the disk, they are handed straight to Gradle's
      # environment (see signingValues in app/build.gradle.kts).
      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::The ANDROID_KEYSTORE_BASE64 secret is not defined; the APK will be built unsigned and cannot be installed on a phone."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NORDA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # The published APK must have passed the tests: a release cannot be undone.
      - name: Tests and lint
        run: ./gradlew test lintDebug

      - name: Release APK
        env:
          NORDA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NORDA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'norda' }}
          NORDA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Delete the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Name the APK
        id: apk
        run: bash .github/scripts/collect-apk.sh release

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Prepare release notes
        if: env.RELEASE_TAG != ''
        env:
          VERSION: ${{ steps.apk.outputs.version }}
          CODE: ${{ steps.apk.outputs.code }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          SIGNED: ${{ steps.apk.outputs.signed }}
        run: |
          {
            echo "Release **$VERSION ($CODE)**."
            echo
            if [ "$SIGNED" = 'true' ]; then
              echo "The APK is signed and can be installed directly on the phone."
            else
              echo "> **Warning:** this APK is unsigned and cannot be installed on a phone."
              echo "> The signing secrets are not configured in the repository (see the header of release.yml)."
            fi
            echo
            echo "To verify the file after downloading:"
            echo
            echo '```'
            echo "sha256sum -c $APK_NAME.apk.sha256"
            echo '```'
            echo
            echo "Scope and roadmap: docs/MVP.md · Changes: CHANGELOG.md"
          } > "$RUNNER_TEMP/notes.md"

      # `--generate-notes` produces the list of commits since the previous tag;
      # the GitHub API appends it *after* the given body, it does not overwrite.
      # `--target`: if the tag does not exist (manual-trigger path) it is created
      # at this commit; if the tag already exists GitHub ignores the flag.
      - name: Publish the GitHub release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Norda $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
