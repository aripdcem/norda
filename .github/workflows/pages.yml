# Norda'nın tanıtım sayfası (norda.aripd.com): site/ klasörü elle yazılmış
# tek HTML'dir, derleme adımı yoktur — Actions yalnız yükler ve yayınlar.
# Özel alan adı repo ayarından (Settings → Pages → Custom domain) okunur;
# site/CNAME dosyası da gelenek gereği artifact'ta taşınır.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; yarım kalan eski koşu iptal edilmez (sayfa yarım kalmasın).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Siteyi yayınla
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages'i yapılandır
        uses: actions/configure-pages@v5
        with:
          # Pages daha önce hiç açılmadıysa ilk koşuda açmayı dener.
          enablement: true

      - name: Site artifact'ını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
