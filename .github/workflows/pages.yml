# Norda's landing page (norda.aripd.com): the site/ folder is a single
# hand-written HTML file with no build step — Actions only uploads and deploys.
# The custom domain is read from the repo settings (Settings → Pages → Custom
# domain); site/CNAME is carried along in the artifact too, by convention.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; an older run still in progress is not cancelled
# (so the page is never left half-deployed).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # If Pages has never been enabled before, the first run tries to enable it.
          enablement: true

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
