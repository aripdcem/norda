# Our own tile-packaging pipeline (docs/MVP.md, 7.2): triggered manually, it
# builds an MBTiles pack for a region, attaches it to a Release under the
# `maps/<id>-vN` tag and updates docs/maps/index.json — the app reads the list
# from there.
#
# No dependency on any live tile server; no secret is needed either
# (GITHUB_TOKEN is enough). The build step is procedural today; when real OSM
# cartography arrives only the "Build the pack" step changes.
#
# `maps/...` tags do not trigger release.yml (it listens to `v*` only).

name: Map pack

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'Pack id (file name, e.g. istanbul)'
        required: true
        type: string
      name:
        description: 'Display name (e.g. Istanbul)'
        required: true
        type: string
      bbox:
        description: 'left,bottom,right,top (lon/lat)'
        required: true
        type: string
      minzoom:
        description: 'Minimum zoom'
        required: false
        default: '8'
        type: string
      maxzoom:
        description: 'Maximum zoom'
        required: false
        default: '13'
        type: string

permissions:
  contents: write   # to create the release and push index.json

concurrency:
  group: map-pack-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  pack:
    name: Build and publish the pack
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Inputs reach the shell through environment variables; special
      # characters in name/bbox cannot be interpreted as commands.
      - name: Tooling tests
        run: python3 -m unittest discover -s tools/tests

      - name: Build the pack
        env:
          PKG_ID: ${{ inputs.id }}
          PKG_NAME: ${{ inputs.name }}
          PKG_BBOX: ${{ inputs.bbox }}
          PKG_MINZOOM: ${{ inputs.minzoom }}
          PKG_MAXZOOM: ${{ inputs.maxzoom }}
        run: |
          python3 tools/make-map-pack.py \
            --id "$PKG_ID" --name "$PKG_NAME" --bbox "$PKG_BBOX" \
            --minzoom "$PKG_MINZOOM" --maxzoom "$PKG_MAXZOOM" --out dist
          FILE="dist/$PKG_ID.mbtiles"
          echo "PKG_FILE=$FILE" >> "$GITHUB_ENV"
          echo "PKG_SHA=$(sha256sum "$FILE" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "PKG_SIZE=$(stat -c%s "$FILE")" >> "$GITHUB_ENV"
          sha256sum "$FILE" > "$FILE.sha256"

      # The pack version is the run number: every publish is a new, immutable tag.
      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_ID: ${{ inputs.id }}
          PKG_NAME: ${{ inputs.name }}
          PKG_BBOX: ${{ inputs.bbox }}
        run: |
          TAG="maps/$PKG_ID-v$GITHUB_RUN_NUMBER"
          {
            echo "Map pack **$PKG_NAME** (\`$PKG_ID\`, v$GITHUB_RUN_NUMBER)."
            echo
            echo "- Coverage: \`$PKG_BBOX\` · zoom ${{ inputs.minzoom }}-${{ inputs.maxzoom }}"
            echo "- Size: $PKG_SIZE bytes"
            echo "- SHA-256: \`$PKG_SHA\`"
            echo
            echo "The app downloads this pack from the list on the Maps screen;"
            echo "for manual installation, download the file and use \"Import package\"."
          } > notes.md
          gh release create "$TAG" "$PKG_FILE" "$PKG_FILE.sha256" \
            --title "Map pack: $PKG_NAME v$GITHUB_RUN_NUMBER" \
            --notes-file notes.md
          echo "PKG_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$PKG_ID.mbtiles" >> "$GITHUB_ENV"

      - name: Update index.json and push
        env:
          PKG_ID: ${{ inputs.id }}
          PKG_NAME: ${{ inputs.name }}
          PKG_BBOX: ${{ inputs.bbox }}
        run: |
          python3 tools/update-map-index.py \
            --id "$PKG_ID" --name "$PKG_NAME" --bbox "$PKG_BBOX" \
            --minzoom "${{ inputs.minzoom }}" --maxzoom "${{ inputs.maxzoom }}" \
            --size "$PKG_SIZE" --sha256 "$PKG_SHA" --url "$PKG_URL" \
            --version "$GITHUB_RUN_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maps/index.json
          git commit -m "chore(maps): $PKG_ID v$GITHUB_RUN_NUMBER [skip ci]"
          # A long build may overlap with other pushes to the branch; rebase
          # onto the remote first so the index commit lands instead of being
          # rejected as non-fast-forward (the release is already published).
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
